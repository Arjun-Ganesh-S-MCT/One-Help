name: Native Android APK
on: { workflow_dispatch: {}, push: { paths: ["android-native/**"] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Refresh shared data
        run: node tools/gen_data.mjs
      - name: Logic tests (same results as the Python app)
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: oru-udhavi-native-debug-apk, path: android-native/app/build/outputs/apk/debug/*.apk }
